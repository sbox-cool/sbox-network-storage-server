version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      microsoft-runtime:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Data.Sqlite*"
          - "Npgsql*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Xunit.*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
    ignore:
      # Tomlyn 1.x+ replaced the Toml/TomlTable API the config loader uses; port deliberately, not via a bump.
      - dependency-name: "Tomlyn"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
