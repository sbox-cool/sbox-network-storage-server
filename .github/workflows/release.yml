name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SERVER_PROJECT: src/SboxNetworkStorage.Server/SboxNetworkStorage.Server.csproj
  IMAGE: ghcr.io/sbox-cool/sbox-network-storage-server

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  smoke:
    name: HTTP parity release gate
    uses: ./.github/workflows/smoke.yml

  stable-parity:
    name: Approved stable HTTP parity release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Require approved stable reference
        shell: bash
        run: |
          # Approved managed-service recording of this exact corpus, committed by
          # review after the Record live parity workflow. Cross-driver parity is not managed parity.
          if [ ! -s tests/parity/stable-reference.json ]; then
            echo "::error::Release blocked: commit an approved managed-service recording as tests/parity/stable-reference.json (see Record live parity workflow)."
            exit 1
          fi
          mkdir -p TestResults
          cp tests/parity/stable-reference.json TestResults/stable.json
      - name: Replay candidate HTTP corpus
        run: bash scripts/smoke.sh --out TestResults/candidate.json
      - name: Compare against approved stable reference
        run: dotnet tools/SboxNetworkStorage.Parity/bin/Release/net10.0/sbox-ns-parity.dll diff --stable TestResults/stable.json --candidate TestResults/candidate.json --allow tests/parity/intentional-differences.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stable-http-parity-release
          path: TestResults/*.json
          if-no-files-found: ignore

  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a semantic version (expected vMAJOR.MINOR.PATCH[-pre])" >&2
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: [test, smoke, stable-parity, meta]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          # macOS binaries are published on macOS so the apphost is code signed (ad hoc),
          # which Apple Silicon requires to execute.
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$SERVER_PROJECT" \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$VERSION" \
            -o "publish/$RID"
          cp LICENSE README.md CHANGELOG.md "publish/$RID/"

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/sbom-tools" CycloneDX --version 6.2.0
          mkdir -p dist
          "$RUNNER_TEMP/sbom-tools/dotnet-CycloneDX" "$SERVER_PROJECT" -r "$RID" -o dist -fn "sbox-ns-$VERSION-$RID.sbom.json" -j

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "publish/$RID" -czf "dist/sbox-ns-$VERSION-$RID.tar.gz" .

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/$env:RID/*" -DestinationPath "dist/sbox-ns-$env:VERSION-$env:RID.zip"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/sbox-ns-*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Container image
    needs: [test, smoke, stable-parity, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          tags="$IMAGE:$VERSION"
          if [ "$PRERELEASE" = "false" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=sbox Network Storage Server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [meta, publish, image]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate release.json
        shell: bash
        env:
          CHANGELOG_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          meta_file=.github/release-meta.json
          if [ ! -f "$meta_file" ]; then
            echo '{}' > "$RUNNER_TEMP/release-meta.json"
            meta_file="$RUNNER_TEMP/release-meta.json"
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg changelogUrl "$CHANGELOG_URL" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson prerelease "$PRERELEASE" \
            --slurpfile meta "$meta_file" \
            '{
              version: $version,
              prerelease: $prerelease,
              minUpgradableFrom: ($meta[0].minUpgradableFrom // null),
              migrationRequired: ($meta[0].migrationRequired // false),
              security: ($meta[0].security // false),
              changelogUrl: $changelogUrl,
              publishedAt: $publishedAt
            }' > dist/release.json
          cat dist/release.json

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cp install/install.sh install/install.ps1 dist/
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS with protected P-256 key
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" || { echo "::error::Set RELEASE_SIGNING_KEY in the protected release-signing environment."; exit 1; }
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out dist/SHA256SUMS.p256.sig dist/SHA256SUMS
          python3 - "$key" <<'PY'
          import pathlib, re, subprocess, sys
          pins = pathlib.Path('src/SboxNetworkStorage.Server/Updates/release-signing-keys.pub').read_text()
          blocks = re.findall(r'-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----', pins, re.S)
          actual = subprocess.check_output(['openssl', 'pkey', '-in', sys.argv[1], '-pubout', '-outform', 'DER'])
          if not blocks:
              sys.exit('No pinned release signing keys; refusing release')
          trusted = [subprocess.check_output(['openssl', 'pkey', '-pubin', '-outform', 'DER'], input=block.encode()) for block in blocks]
          if actual not in trusted:
              sys.exit('Release signing key does not match compiled trust anchors')
          PY

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - name: Sign SHA256SUMS (keyless)
        shell: bash
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: sbox-ns ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sbox-ns-*.tar.gz
            dist/sbox-ns-*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.p256.sig
            dist/sbox-ns-*.sbom.json
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
            dist/release.json
            dist/install.sh
            dist/install.ps1
