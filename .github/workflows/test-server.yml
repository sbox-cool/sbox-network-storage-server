name: Live test server

# Exercises a disposable Vultr VPS (SQLite, plain HTTP on :8080) over the real network and replays
# the HTTP parity corpus against it. The box is throwaway: nothing on it is precious.
#
# Modes (workflow_dispatch input; pushes to main run `deploy`):
#   deploy     build this commit and swap it in, keeping the existing data
#   reinstall  wipe config and data, then install this commit from scratch
#   upgrade    wipe, install the latest published release with install/install.sh, then update it in
#              place to this commit; the version must change and the release's projects must survive
#   installer  wipe, install the latest published release with install/install.sh, and test that
#
# Runs are serialised (one at a time) by the concurrency group; the VPS is shared state.
# Secrets: TEST_SERVER_HOST (public IPv4), TEST_SERVER_SSH_KEY (private deploy key, root),
# TEST_SERVER_KNOWN_HOSTS (pinned `ssh-keyscan -t ed25519` line for the host).
# Runs on main and by hand only, so pull requests from forks never reach the secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: What to exercise on the VPS
        type: choice
        options: [deploy, reinstall, upgrade, installer]
        default: deploy

permissions:
  contents: read

concurrency:
  group: live-test-server
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SERVER_PROJECT: src/SboxNetworkStorage.Server/SboxNetworkStorage.Server.csproj
  PARITY: tools/SboxNetworkStorage.Parity/bin/Release/net10.0/sbox-ns-parity.dll
  MODE: ${{ inputs.mode || 'deploy' }}

jobs:
  live:
    name: ${{ inputs.mode || 'deploy' }} on the VPS, then replay the corpus
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Configure SSH
        shell: bash
        env:
          HOST: ${{ secrets.TEST_SERVER_HOST }}
          KEY: ${{ secrets.TEST_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TEST_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HOST KEY KNOWN_HOSTS; do
            if [ -z "${!v:-}" ]; then echo "::error::Set the TEST_SERVER_$v secret."; exit 1; fi
          done
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/test-server
          printf '%s\n' "$KEY" > ~/.ssh/test-server
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host test-server
            HostName $HOST
            User root
            IdentityFile ~/.ssh/test-server
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF

      - name: Publish linux-x64 and build the parity tool
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" != installer ]; then
            dotnet publish "$SERVER_PROJECT" -c Release -r linux-x64 --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:Version="0.0.0-live.${GITHUB_RUN_NUMBER}" \
              -o publish/linux-x64
            tar -C publish/linux-x64 -czf sbox-ns-live.tar.gz .
          fi
          dotnet build tools/SboxNetworkStorage.Parity -c Release

      - name: Install the latest published release (baseline)
        if: env.MODE == 'upgrade' || env.MODE == 'installer'
        shell: bash
        env:
          HOST: ${{ secrets.TEST_SERVER_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "::notice::Baseline release $version"
          scp install/install.sh scripts/ci/live-baseline-install.sh test-server:/tmp/
          ssh test-server "bash /tmp/live-baseline-install.sh http://$HOST:8080 ${version#v}"

      - name: Install this build on the VPS
        shell: bash
        env:
          HOST: ${{ secrets.TEST_SERVER_HOST }}
        run: |
          set -euo pipefail
          scp scripts/ci/deploy-test-server.sh test-server:/tmp/
          case "$MODE" in
            deploy|upgrade)
              scp sbox-ns-live.tar.gz test-server:/tmp/
              ssh test-server "bash /tmp/deploy-test-server.sh /tmp/sbox-ns-live.tar.gz http://$HOST:8080" ;;
            reinstall)
              scp sbox-ns-live.tar.gz test-server:/tmp/
              ssh test-server "bash /tmp/deploy-test-server.sh --reset /tmp/sbox-ns-live.tar.gz http://$HOST:8080" ;;
            installer)
              ssh test-server "bash /tmp/deploy-test-server.sh --no-install http://$HOST:8080" ;;
            *) echo "::error::Unknown mode $MODE"; exit 1 ;;
          esac

      - name: Replay the parity corpus against the live server
        shell: bash
        env:
          HOST: ${{ secrets.TEST_SERVER_HOST }}
        run: |
          set -euo pipefail
          fixture="$(ssh test-server cat /root/live-fixture.env)"
          project="$(sed -n 's/^PROJECT_ID=//p' <<<"$fixture")"
          public="$(sed -n 's/^PUBLIC_KEY=//p' <<<"$fixture")"
          secret="$(sed -n 's/^SECRET_KEY=//p' <<<"$fixture")"
          echo "::add-mask::$public"
          echo "::add-mask::$secret"
          curl -fsS --max-time 10 "http://$HOST:8080/v3/server-info" | jq '{version, kind, database}'
          mkdir -p TestResults
          dotnet "$PARITY" check --target "http://$HOST:8080" --project-id "$project" \
            --public-key "$public" --secret-key "$secret" --corpus tests/parity/corpus \
            --out "TestResults/live-$MODE.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-test-server-${{ inputs.mode || 'deploy' }}
          path: TestResults/*.json
          if-no-files-found: ignore
