name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: Build and test (${{ matrix.os }}, PostgreSQL ${{ matrix.postgres || 'disabled' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            postgres: "13"
          - os: ubuntu-latest
            postgres: "14"
          - os: ubuntu-latest
            postgres: "15"
          - os: ubuntu-latest
            postgres: "16"
          - os: ubuntu-latest
            postgres: "17"
          - os: ubuntu-latest
            postgres: "18"
          - os: windows-latest
            postgres: ""
          - os: macos-latest
            postgres: ""
    # Service containers are only supported on Linux runners. An empty image
    # name skips the service, so PostgreSQL runs on ubuntu only and the
    # Postgres tests skip themselves when NS_TEST_POSTGRES is empty.
    services:
      postgres:
        image: ${{ matrix.postgres != '' && format('postgres:{0}', matrix.postgres) || '' }}
        env:
          POSTGRES_USER: sbox_ns
          POSTGRES_PASSWORD: sbox_ns
          POSTGRES_DB: sbox_ns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbox_ns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NS_TEST_POSTGRES: ${{ matrix.postgres != '' && 'Host=localhost;Port=5432;Database=sbox_ns_test;Username=sbox_ns;Password=sbox_ns' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SboxNetworkStorage.sln

      - name: Reject vulnerable dependencies
        shell: pwsh
        run: |
          $report = dotnet list SboxNetworkStorage.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed' }
          $audit = ($report -join "`n") | ConvertFrom-Json
          if ($audit.problems) { throw ($audit.problems | ConvertTo-Json -Depth 20) }
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities | Where-Object { $_.severity -in @('High', 'Critical') }) {
                  throw "Vulnerable dependency: $($package.id) $($package.resolvedVersion)"
                }
              }
            }
          }

      - name: Build
        run: dotnet build SboxNetworkStorage.sln -c Release --no-restore

      - name: Test
        run: dotnet test SboxNetworkStorage.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Test Linux root tunnel ownership
        if: runner.os == 'Linux' && matrix.postgres == '18'
        shell: bash
        run: |
          dotnet_host="$(command -v dotnet)"
          sudo env \
            DOTNET_HOST_PATH="$dotnet_host" \
            DOTNET_CLI_HOME="$RUNNER_TEMP/sbox-ns-root-dotnet" \
            DOTNET_NOLOGO=true \
            DOTNET_CLI_TELEMETRY_OPTOUT=true \
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE=true \
            "$dotnet_host" test tests/SboxNetworkStorage.Cli.Tests/SboxNetworkStorage.Cli.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName=SboxNetworkStorage.Cli.Tests.TunnelOperatingSystemTests.Root_administration_preserves_service_owner_access_and_unprivileged_reenable' \
            --logger 'trx;LogFileName=linux-root-tunnel.trx' --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}-postgres-${{ matrix.postgres || 'disabled' }}
          path: TestResults
          if-no-files-found: ignore

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  js-guards:
    name: Visual editor JS guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run owner editor guard tests
        run: node --test tests/js/owner-json-editor.test.js
