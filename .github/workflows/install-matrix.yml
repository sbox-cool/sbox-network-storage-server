name: Install matrix
# Real install, upgrade from the previous release, update and rollback on disposable machines.
# Releases are built from this commit, signed with a throwaway key pinned for this run only, and
# served by a local fixture (scripts/ci/). See scripts/ci/install-matrix.sh for what is checked.
on:
  pull_request:
    branches: [main]
    paths:
      - install/**
      - src/SboxNetworkStorage.Server/Updates/**
      - src/SboxNetworkStorage.Server/Cli/**
      - src/SboxNetworkStorage.Server/Configuration/**
      - scripts/ci/**
      - scripts/pin-release-keys.sh
      - .github/workflows/install-matrix.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CANDIDATE: 90.0.0
  NEXT: 90.0.1
  PREVIOUS: 0.4.0
jobs:
  linux:
    name: Linux (${{ matrix.os }}, ${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
        scenario: [fresh, upgrade]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build signed candidate releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rid=linux-x64; [[ "$(uname -m)" == aarch64 ]] && rid=linux-arm64
          previous=(); [[ "${{ matrix.scenario }}" == upgrade ]] && previous=(--previous "$PREVIOUS")
          scripts/ci/build-release-fixture.sh --rid "$rid" --out "$RUNNER_TEMP/fixture" "${previous[@]}" "$CANDIDATE" "$NEXT"
      - name: Install, update and roll back
        run: |
          previous=(); [[ "${{ matrix.scenario }}" == upgrade ]] && previous=(--previous "$PREVIOUS")
          sudo scripts/ci/install-matrix.sh --fixture "$RUNNER_TEMP/fixture" --scenario "${{ matrix.scenario }}" \
            --candidate "$CANDIDATE" --next "$NEXT" "${previous[@]}"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo journalctl --no-pager -n 2000 | tee "$RUNNER_TEMP/logs/journal.txt" > /dev/null || true
          sudo cp /var/log/release-fixture.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          sudo chmod -R a+r "$RUNNER_TEMP/logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-matrix-${{ matrix.os }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/logs

  debian:
    # No hosted Debian runner: Debian 12 boots systemd as PID 1 in a privileged container on an
    # Ubuntu VM. Units, users, the installer and the updater run for real; the kernel and cgroups
    # are the host's, so sandbox (journal) checks here are weaker than on the VM jobs.
    name: Debian 12 (${{ matrix.scenario }}, systemd container)
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build signed candidate releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=(); [[ "${{ matrix.scenario }}" == upgrade ]] && previous=(--previous "$PREVIOUS")
          scripts/ci/build-release-fixture.sh --rid linux-x64 --out "$RUNNER_TEMP/fixture" "${previous[@]}" "$CANDIDATE" "$NEXT"
      - name: Boot Debian 12 with systemd
        run: |
          docker build -t sbox-ns-debian12 - <<'EOF'
          FROM debian:12
          RUN apt-get update && apt-get install -y --no-install-recommends systemd systemd-sysv dbus ca-certificates curl openssl python3 procps tar gzip \
           && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          EOF
          docker run -d --name debian12 --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/fixture:/fixture:ro" sbox-ns-debian12
          for _ in $(seq 60); do docker exec debian12 systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break; sleep 1; done
          docker exec debian12 systemctl is-system-running || true
      - name: Install, update and roll back
        run: |
          previous=(); [[ "${{ matrix.scenario }}" == upgrade ]] && previous=(--previous "$PREVIOUS")
          docker exec debian12 /src/scripts/ci/install-matrix.sh --fixture /fixture --scenario "${{ matrix.scenario }}" \
            --candidate "$CANDIDATE" --next "$NEXT" "${previous[@]}"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          docker exec debian12 journalctl --no-pager -n 2000 > "$RUNNER_TEMP/logs/journal.txt" || true
          docker exec debian12 cat /var/log/release-fixture.log > "$RUNNER_TEMP/logs/release-fixture.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-matrix-debian12-${{ matrix.scenario }}
          path: ${{ runner.temp }}/logs

  windows:
    name: Windows (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (the installer's ECDsaCng path), pwsh = PowerShell 7.
        shell: [powershell, pwsh]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build signed candidate release
        shell: bash
        run: scripts/ci/build-release-fixture.sh --rid win-x64 --out "$RUNNER_TEMP/fixture" "$CANDIDATE"
      - name: Install with install.ps1
        shell: pwsh
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci/install-matrix.ps1 -Fixture "$env:RUNNER_TEMP/fixture" -Candidate $env:CANDIDATE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: install-matrix-windows-${{ matrix.shell }}
          path: ${{ runner.temp }}/release-fixture.log
