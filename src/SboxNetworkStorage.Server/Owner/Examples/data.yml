- id: workflow.streak_bonus
  kind: workflow
  category: Flow
  title: Streak bonus workflow
  summary: Reusable logic run from a condition route. Reads its streak param and returns bonus gold.
  source: |
    sourceVersion: 1
    kind: workflow
    id: streak_bonus
    name: Streak bonus
    description: Five gold per streak day, capped at ten days.
    params:
      streak:
        type: number
        description: Days in a row
    steps:
      - id: bonus
        type: compute
        values:
          amount: "min({{streak}}, 10) * 5"
    returns:
      bonus: "{{bonus.amount}}"

- id: workflow.level_from_xp
  kind: workflow
  category: Progression
  title: Level from xp workflow
  summary: Shared compute and switch logic called from endpoints with an xp param; returns level and tier.
  source: |
    sourceVersion: 1
    kind: workflow
    id: level_from_xp
    name: Level from xp
    description: One level per 100 xp; tiers at level 5 and 10.
    params:
      xp:
        type: number
        description: Total xp
    steps:
      - id: stats
        type: compute
        values:
          level: "floor({{xp}} / 100) + 1"
      - id: tier
        type: switch
        cases:
          - when:
              field: stats.level
              op: ">="
              value: 10
            then: gold
          - when:
              field: stats.level
              op: ">="
              value: 5
            then: silver
        default: bronze
    returns:
      level: "{{stats.level}}"
      tier: "{{tier}}"

- id: query.top_xp
  kind: query
  category: Leaderboards
  title: XP leaderboard with a join
  summary: Ranks players by xp and left-joins each player's Telegram link through telegram_id.
  requires: [collection.players, collection.telegram_links]
  calls:
    - method: GET
  source: |
    sourceVersion: 1
    kind: query
    id: top_xp
    name: Top XP
    type: leaderboard
    sources:
      - collectionId: players
        alias: player
    config:
      field: xp
      order: desc
      limit: 10
      fields:
        - name
        - xp
        - level
        - tier
      joins:
        - sourceCollectionId: telegram_links
          alias: telegram
          localKey: telegram_id
          foreignKey: telegram_id
          type: left
    cache:
      ttlSeconds: 60
    requiresSecretKey: false

- id: query.total_gold
  kind: query
  category: Stats
  title: Total gold in circulation
  summary: A sum query over every player's gold.
  requires: [collection.players]
  calls:
    - method: GET
  source: |
    sourceVersion: 1
    kind: query
    id: total_gold
    name: Total gold
    type: sum
    sources:
      - collectionId: players
    config:
      field: gold
    cache:
      ttlSeconds: 300

- id: query.daily_claimers
  kind: query
  category: Stats
  title: Players who claimed a daily reward
  summary: A count query with an exists condition on last_daily.
  requires: [collection.players]
  calls:
    - method: GET
  source: |
    sourceVersion: 1
    kind: query
    id: daily_claimers
    name: Daily claimers
    type: count
    sources:
      - collectionId: players
    config:
      field: last_daily
      condition: exists
    cache:
