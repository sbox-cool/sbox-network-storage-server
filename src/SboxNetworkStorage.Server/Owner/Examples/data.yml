- id: endpoint.grant-coins
  kind: endpoint
  category: Getting started
  title: Grant coins
  summary: Read the player, guard with a condition on the read result, then add coins with an inc op.
  requires: [collection.starter_players]
  calls:
    - input: '{"amount":5}'
    - input: '{"amount":0}'
      status: 400
  source: |
    sourceVersion: 1
    kind: endpoint
    id: grant-coins
    name: Grant coins
    method: POST
    enabled: true
    input:
      type: object
      properties:
        amount:
          type: number
      required:
        - amount
    steps:
      - id: player
        type: read
        collection: starter_players
        key: "{{steamId}}"
      - id: can_grant
        type: condition
        check:
          all:
            - field: input.amount
              op: ">"
              value: 0
            - field: player.coins|0
              op: "<"
              value: 1000000
        onFail:
          status: 400
          error: INVALID_GRANT
          message: Send a positive amount below the coin cap.
      - id: total
        type: transform
        expression: "{{player.coins|0}} + {{input.amount}}"
      - id: grant
        type: write
        collection: starter_players
        key: "{{steamId}}"
        ops:
          - op: inc
            path: coins
            value: "{{input.amount}}"
            source: grant
            reason: Granted by endpoint
    response:
      status: 200
      body:
        coins: "{{total}}"
