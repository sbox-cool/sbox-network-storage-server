# Collections, game values, workflows and queries. Most are companions that
# the endpoint examples create with one click; each is also a gallery entry.
- id: collection.players
  kind: collection
  category: Player data
  title: Player profile collection
  summary: One record per player with a ledger-tracked gold balance, progress, inventory and quest history.
  source: |
    sourceVersion: 1
    kind: collection
    id: players
    name: players
    description: One record per player. Endpoints change it; clients read it.
    collectionType: per-steamid
    accessMode: endpoint
    maxRecords: 1
    allowRecordDelete: false
    rateLimits:
      mode: player
      savesPerDay: 8640
    rateLimitAction: reject
    schema:
      type: object
      properties:
        gold:
          type: number
          default: 0
          min: 0
          _ledger: true
          description: Spendable currency. Only endpoints change it.
        xp:
          type: number
          default: 0
          min: 0
        level:
          type: number
          default: 1
          min: 1
        tier:
          type: string
          enum:
            - bronze
            - silver
            - gold
        kills:
          type: number
          default: 0
        health:
          type: number
          default: 100
        name:
          type: string
        last_daily:
          type: string
          description: UTC date (YYYY-MM-DD) of the last daily reward.
        telegram_id:
          type: string
        inventory:
          type: array
          items:
            type: object
            properties:
              item_id:
                type: string
              name:
                type: string
        completed_quests:
          type: array
          items:
            type: string
        materials:
          type: object
          additionalProperties:
            type: number

- id: collection.player_saves
  kind: collection
  category: Player data
  title: Save slots
  summary: Up to five records per player, keyed steamId_saveId, for games with several save files. Players may delete slots.
  source: |
    sourceVersion: 1
    kind: collection
    id: player_saves
    name: player_saves
    description: Save slots keyed {{steamId}}_{{input.saveId}}.
    collectionType: per-steamid
    accessMode: endpoint
    maxRecords: 5
    allowRecordDelete: true
    requireSaveVersion: false
    schema:
      type: object
      properties:
        label:
          type: string
        level:
          type: number
          min: 1
        created_at:
          type: datetime
        updated_at:
          type: datetime

- id: collection.wallets
  kind: collection
  category: Anti-cheat
  title: Wallet with anti-cheat flags
  summary: Required fields, a unique wallet id, a ledger balance and per-window limits, with a clamp rate limit on saves.
  source: |
    sourceVersion: 1
    kind: collection
    id: wallets
    name: wallets
    description: Currency wallet with integrity flags.
    collectionType: per-steamid
    accessMode: endpoint
    maxRecords: 1
    allowRecordDelete: false
    rateLimits:
      mode: player
      savesPerDay: 2000
    rateLimitAction: clamp
    webhookOnRateLimit: false
    schema:
      type: object
      required:
        - wallet_id
        - coins
      properties:
        wallet_id:
          type: string
          _unique: true
        coins:
          type: number
          min: 0
          default: 0
          _ledger: true
          _maxPerHour: 1000
          _maxPerDay: 5000
        gems:
          type: number
          min: 0
          default: 0
          _maxPerWeek: 50
        created_at:
          type: datetime

- id: collection.telegram_links
  kind: collection
  category: Integrations
  title: Telegram link mapping (global)
  summary: A global collection keyed tg_<telegram id> that maps an external bot user to a player.
  source: |
    sourceVersion: 1
    kind: collection
    id: telegram_links
    name: telegram_links
    description: Shared records keyed tg_<telegram user id>.
    collectionType: global
    accessMode: endpoint
    allowRecordDelete: true
    schema:
      type: object
      properties:
        steam_id:
          type: player
        telegram_id:
          type: string
        linked_at:
          type: datetime

